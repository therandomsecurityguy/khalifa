AWSTemplateFormatVersion: '2010-09-09'
Description: 'Role for Security Graph ingestion - deployed via StackSet'
Parameters:
  TrustedPrincipalArn:
    Type: String
    Description: 'ARN of the hub principal that assumes this role'
  AdditionalTrustedPrincipalArn:
    Type: String
    Default: ''
    Description: 'Optional second hub principal trusted to assume this role'
  ExternalId:
    Type: String
    MinLength: 16
    Description: 'External ID the hub must present when assuming this role'
Conditions:
  HasAdditionalTrustedPrincipal: !Not [!Equals [!Ref AdditionalTrustedPrincipalArn, '']]
Resources:
  CreateCollectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SecurityGraphCollectorRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TrustedPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
          - !If
            - HasAdditionalTrustedPrincipal
            - Effect: Allow
              Principal:
                AWS: !Ref AdditionalTrustedPrincipalArn
              Action: sts:AssumeRole
              Condition:
                StringEquals:
                  sts:ExternalId: !Ref ExternalId
            - !Ref AWS::NoValue
      Path: /
      Policies:
        - PolicyName: CollectionPolicyV3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - access-analyzer:ListAnalyzers
                  - apigateway:GET
                  - backup:ListBackupPlans
                  - backup:ListBackupVaults
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                  - cloudtrail:GetEventSelectors
                  - cloudwatch:DescribeAlarms
                  - config:DescribeConfigRules
                  - config:DescribeConfigurationRecorders
                  - config:DescribeConfigurationRecorderStatus
                  - config:DescribeDeliveryChannels
                  - dynamodb:DescribeTable
                  - dynamodb:ListTables
                  - ec2:Describe*
                  - ec2:DescribeFlowLogs
                  - ec2:DescribeVolumes
                  - ec2:GetEbsEncryptionByDefault
                  - ecr:DescribeRepositories
                  - ecr:ListImages
                  - eks:DescribeCluster
                  - eks:ListClusters
                  - elasticache:DescribeCacheClusters
                  - elasticfilesystem:DescribeFileSystems
                  - elasticloadbalancing:DescribeLoadBalancers
                  - es:DescribeDomain
                  - es:ListDomainNames
                  - events:ListEventBuses
                  - guardduty:GetAdministratorAccount
                  - guardduty:GetDetector
                  - guardduty:GetFindings
                  - guardduty:ListDetectors
                  - guardduty:ListFindings
                  - iam:GenerateCredentialReport
                  - iam:GetAccessKeyLastUsed
                  - iam:GetAccountPasswordPolicy
                  - iam:GetAccountSummary
                  - iam:GetCredentialReport
                  - iam:GetGroupPolicy
                  - iam:GetLoginProfile
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:GetUser
                  - iam:GetUserPolicy
                  - iam:ListAccessKeys
                  - iam:ListAttachedGroupPolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListAttachedUserPolicies
                  - iam:ListGroupPolicies
                  - iam:ListGroups
                  - iam:ListGroupsForUser
                  - iam:ListInstanceProfiles
                  - iam:ListMFADevices
                  - iam:ListPolicies
                  - iam:ListPolicyVersions
                  - iam:ListRolePolicies
                  - iam:ListRoles
                  - iam:ListServerCertificates
                  - iam:ListUserPolicies
                  - iam:ListUsers
                  - iam:ListVirtualMFADevices
                  - kms:DescribeKey
                  - kms:GetKeyRotationStatus
                  - kms:ListKeys
                  - lambda:ListAliases
                  - lambda:ListFunctions
                  - logs:DescribeLogGroups
                  - logs:DescribeMetricFilters
                  - rds:DescribeDBInstances
                  - redshift:DescribeClusters
                  - route53:ListHostedZones
                  - s3:GetAccountPublicAccessBlock
                  - s3:GetBucketAcl
                  - s3:GetBucketLogging
                  - s3:GetBucketPolicy
                  - s3:GetBucketPolicyStatus
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketTagging
                  - s3:GetBucketVersioning
                  - s3:GetEncryptionConfiguration
                  - s3:ListAllMyBuckets
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:ListSecrets
                  - securityhub:DescribeHub
                  - securityhub:GetEnabledStandards
                  - securityhub:GetFindings
                  - securityhub:ListFindings
                  - ssm:DescribeParameters
                  - states:ListStateMachines
                  - tag:GetResources
                Resource: '*'
Outputs:
  CollectorRoleArn:
    Description: 'ARN of the Collector Role'
    Value: !GetAtt CreateCollectorRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-CollectorRoleArn'
