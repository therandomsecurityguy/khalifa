# In-memory TinkerGraph for CI graph-query tests. String vertex ids, like
# Neptune's ARN ids; the image default (LONG) rejects them.
gremlin.graph=org.apache.tinkerpop.gremlin.tinkergraph.structure.TinkerGraph
gremlin.tinkergraph.vertexIdManager=ANY
gremlin.tinkergraph.edgeIdManager=ANY
gremlin.tinkergraph.vertexPropertyIdManager=LONG
