name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run ci:quality

      - name: Audit dependency regressions
        run: npm run ci:audit

      - name: Synthesize CDK
        working-directory: cdk
        env:
          COLLECTION_ACCOUNT_IDS: '111122223333'
          COLLECTOR_EXTERNAL_ID: ci-collector-external-id
          HOME_ACCOUNT_ID: '111122223333'
          NEPTUNE_CLUSTER_RESOURCE_ID: cluster-ci
        run: npm exec -- cdk synth --no-lookups

      - name: Generate dependency SBOM
        run: npm sbom --sbom-format=cyclonedx --omit=dev > artifacts/npm.cdx.json

      - name: Upload build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: khalifa-build-${{ github.sha }}
          path: |
            artifacts/lambdas
            artifacts/npm.cdx.json
            cdk/cdk.out
          if-no-files-found: error
          retention-days: 14

  containers:
    name: Container smoke tests
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build and smoke test
        run: bash scripts/smoke-containers.sh

  deployment:
    name: Deployment modules
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Setup kind
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 \
            --output /tmp/kind-linux-amd64
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /tmp/kind-linux-amd64' | sha256sum --check
          sudo install /tmp/kind-linux-amd64 /usr/local/bin/kind
          kind version

      - name: Install kubeconform
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            --output /tmp/kubeconform.tar.gz
          echo '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/kubeconform.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/kubeconform.tar.gz --directory /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validate modules
        run: bash scripts/validate-deployment-modules.sh

      - name: Exercise Helm lifecycle
        run: bash scripts/smoke-helm-lifecycle.sh

  tag:
    name: Auto tag release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [containers, deployment]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      # A release tag is cut once this many commits have landed since the
      # previous release tag (every commit counts, merge commits included).
      # Override with the KHALIFA_RELEASE_MIN_COMMITS repository variable.
      MIN_COMMITS: ${{ vars.KHALIFA_RELEASE_MIN_COMMITS || '10' }}
    steps:
      # Tag pushes made with the workflow token do not trigger the Release
      # workflow, so without a GH_KHALIFA PAT the release is dispatched
      # explicitly below. With the PAT set, the tag push triggers it.
      - name: Select tag token
        id: token
        env:
          GH_KHALIFA: ${{ secrets.GH_KHALIFA }}
        run: |
          if [[ -z "$GH_KHALIFA" ]]; then
            echo "GH_KHALIFA is not set; using the workflow token and dispatching the release explicitly." >&2
            echo "use_pat=false" >>"$GITHUB_OUTPUT"
          else
            echo "use_pat=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_KHALIFA || github.token }}

      - name: Bump version and push tag
        id: tag
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ ! "$MIN_COMMITS" =~ ^[1-9][0-9]*$ ]]; then
            echo "KHALIFA_RELEASE_MIN_COMMITS must be a positive integer: $MIN_COMMITS" >&2
            exit 1
          fi

          existing="$(git tag --points-at "$GITHUB_SHA" --sort=-version:refname | sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/ {p;q;}')"
          if [[ -n "$existing" ]]; then
            echo "Commit already tagged: $existing"
            echo "tagged=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          latest="$(git tag --sort=-version:refname | sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/ {p;q;}')"
          if [[ -z "$latest" ]]; then
            commits="$(git rev-list --count HEAD)"
          else
            commits="$(git rev-list --count "$latest"..HEAD)"
          fi
          if (( commits < MIN_COMMITS )); then
            echo "Only $commits commit(s) since ${latest:-the first commit}; $MIN_COMMITS required. Skipping tag."
            {
              echo "### No release yet"
              echo
              echo "$commits of $MIN_COMMITS commits since ${latest:-the first commit} (threshold from KHALIFA_RELEASE_MIN_COMMITS)."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "tagged=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$latest" ]]; then
            next="v1.0.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            if [[ "$COMMIT_MSG" == "Merge pull request"* ]]; then
              next="v${major}.$((minor + 1)).0"
            else
              next="v${major}.${minor}.$((patch + 1))"
            fi
          fi

          echo "Latest: ${latest:-none}; commits since: $commits; next: $next"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$next"
          git push origin "$next"
          echo "tagged=true" >>"$GITHUB_OUTPUT"
          echo "version=$next" >>"$GITHUB_OUTPUT"

      - name: Dispatch release
        if: steps.tag.outputs.tagged == 'true' && steps.token.outputs.use_pat != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f version="$RELEASE_VERSION" -f dry_run=false
          {
            echo "### Tagged $RELEASE_VERSION"
            echo
            echo "Release workflow dispatched for $RELEASE_VERSION."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Note PAT-chained release
        if: steps.tag.outputs.tagged == 'true' && steps.token.outputs.use_pat == 'true'
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          {
            echo "### Tagged $RELEASE_VERSION"
            echo
            echo "The tag push triggers the Release workflow through GH_KHALIFA."
          } >>"$GITHUB_STEP_SUMMARY"
