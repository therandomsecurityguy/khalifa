name: Mirror Gremlin Server image

# Run by hand. Builds test/gremlin/Dockerfile (the pinned Gremlin Server image
# with its CA trust store upgraded) and pushes it to GHCR, so the graph-queries
# job does not hit Docker Hub's pull rate limit.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET: ghcr.io/therandomsecurityguy/khalifa-gremlin-server:3.7.1-ca20261020

jobs:
  mirror:
    name: Build and push to GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      # graph-queries runs on amd64 runners only. The Dockerfile fails the
      # build if ca-certificates is still below the fixed version.
      - name: Build and push image
        run: docker buildx build --platform linux/amd64 --pull --push --tag "$TARGET" test/gremlin

      - name: Print digest
        run: |
          pushed=$(docker buildx imagetools inspect "$TARGET" --format '{{json .Manifest}}' | jq -r .digest)
          echo "Pushed $TARGET@$pushed (pin it in graph-queries.yml)"
          echo "Pushed \`$TARGET@$pushed\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out
        if: always()
        run: docker logout ghcr.io
