apiVersion: v1
kind: ConfigMap
metadata:
  name: security-graph-config
  namespace: security-graph
data:
  NEPTUNE_ENDPOINT: "neptune-cluster.us-east-1.amazonaws.com"
  ISSUES_TABLE: "SecurityIssues"
  EVIDENCE_TABLE: "ComplianceEvidence"
  REPORTS_TABLE: "ComplianceReports"
  POSTURE_TRENDS_TABLE: "PostureTrends"
  ISSUES_TOPIC_ARN: ""
  ISSUE_SINKS: "sns"
  SLACK_MIN_SEVERITY: "high"
  UI_BASE_URL: ""
  COGNITO_USER_POOL_ID: ""
  COGNITO_CLIENT_ID: ""
  COGNITO_REGION: "us-east-1"
  LOG_LEVEL: "info"
  API_PORT: "8080"
  RULE_RUNNER_SCHEDULE: "0 */6 * * *"
  DSPM_SCAN_MODE: "tagged-only"
  MACIE_ENABLED: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: security-graph-secrets
  namespace: security-graph
type: Opaque
stringData:
  # These will be populated via AWS Secrets Manager or CDK
  NEPTUNE_AUTH_SECRET_ARN: "arn:aws:secretsmanager:us-east-1:123456789012:secret:neptune-auth"
