  schedule: '30 5 * * *'
  timeZone: America/Los_Angeles

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
  hosts:
    - host: api.khalifa.validation.invalid
      paths:
        - path: /
          pathType: Prefix
          component: api
    - host: khalifa.validation.invalid
      paths:
        - path: /
          pathType: Prefix
          component: ui
  tls:
    - hosts:
        - api.khalifa.validation.invalid
        - khalifa.validation.invalid
      secretName: khalifa-validation-tls

networkPolicies:
  enabled: true
  egressCidrs:
    - cidr: 10.20.0.0/16
      ports:
        - protocol: TCP
          port: 8182
      components:
        - api
        - rule-runner
        - org-collector
        - incremental
        - graph-writer
        - compliance
        - cloudtrail-analyzer
        - policy-evaluator
        - least-privilege-sweep
    - cidr: 10.30.0.0/24
      ports:
        - protocol: TCP
          port: 443
      components:
        - api
        - rule-runner
        - org-collector
        - incremental
        - graph-writer
        - compliance
        - cloudtrail-analyzer
        - dspm-scanner
        - policy-evaluator
        - least-privilege-sweep

# The runtime secret is supplied by External Secrets; the chart no longer
# accepts collection.externalId / graphWriter.token.
externalSecrets:
  targetName: khalifa-runtime
