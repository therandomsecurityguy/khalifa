config:
  awsRegion: us-west-2
  neptuneEndpoint: wss://neptune.validation.invalid:8182/gremlin
  neptuneQueryTimeoutMs: 30000
  neptuneMaxAttempts: 3
  neptuneMaxResults: 1000
  issuesTable: validation-khalifa-issues
  evidenceTable: validation-khalifa-evidence
  reportsTable: validation-khalifa-reports
  postureTrendsTable: validation-khalifa-posture-trends
  accessAnalyzerTable: validation-khalifa-access-analyzer
  leastPrivilegeTable: validation-khalifa-least-privilege
  cognitoUserPoolId: us-west-2_validation
  cognitoClientId: validationclient
  cognitoRegion: us-west-2
  cloudflareAccessTeamDomain: example-team.cloudflareaccess.com
  cloudflareAccessAud: validation-khalifa-access-aud
  corsAllowedOrigins:
    - https://khalifa.validation.invalid
  issueSinks:
    - sns
  issuesTopicArn: arn:aws:sns:us-west-2:111122223333:validation-khalifa-issues
  uiBaseUrl: https://khalifa.validation.invalid

collection:
  homeAccountId: '111122223333'
  accountIds:
    - '111122223333'
  regions:
    - us-west-2
  incrementalQueueUrl: https://sqs.us-west-2.amazonaws.com/111122223333/validation-khalifa-incremental.fifo

api:
  image: 111122223333.dkr.ecr.us-west-2.amazonaws.com/khalifa-api@sha256:1111111111111111111111111111111111111111111111111111111111111111
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack

ui:
  image: 111122223333.dkr.ecr.us-west-2.amazonaws.com/khalifa-ui@sha256:2222222222222222222222222222222222222222222222222222222222222222
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1

ruleRunner:
  image: 111122223333.dkr.ecr.us-west-2.amazonaws.com/khalifa-rule-runner@sha256:3333333333333333333333333333333333333333333333333333333333333333
  schedule: '0 * * * *'
  timeZone: America/Los_Angeles

