apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "khalifa.fullname" . }}-ui
  labels:
    {{- include "khalifa.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  {{- if not .Values.ui.autoscaling.enabled }}
  replicas: {{ .Values.ui.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "khalifa.selectorLabels" (dict "root" . "component" "ui") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "khalifa.selectorLabels" (dict "root" . "component" "ui") | nindent 8 }}
        {{- with .Values.ui.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.ui.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "khalifa.serviceAccountName" (dict "root" . "key" "ui" "suffix" "ui") }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.ui.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "khalifa.podSecurityContext" . | nindent 8 }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        {{- include "khalifa.topologySpreadConstraints" (dict "root" . "component" "ui") | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: ui
          image: {{ required "ui.image must be an immutable repository@sha256 digest" .Values.ui.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "khalifa.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
              protocol: TCP
          {{- if and .Values.externalSecrets.enabled (has "ui" .Values.externalSecrets.mountIn) }}
          envFrom:
            - secretRef:
                name: {{ .Values.externalSecrets.targetName }}
          {{- end }}
          env:
            - name: PORT
              value: {{ .Values.ui.port | quote }}
            - name: KHALIFA_API_URL
              value: {{ printf "http://%s-api:%v" (include "khalifa.fullname" .) .Values.api.service.port | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/ui/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "khalifa.fullname" . }}-ui
  labels:
    {{- include "khalifa.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  {{- with .Values.ui.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    {{- include "khalifa.selectorLabels" (dict "root" . "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
