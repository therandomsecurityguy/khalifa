{{- range $item := list (dict "key" "api" "suffix" "api") (dict "key" "ui" "suffix" "ui") (dict "key" "ruleRunner" "suffix" "rule-runner") (dict "key" "organizationCollector" "suffix" "org-collector") (dict "key" "incrementalCollector" "suffix" "incremental") (dict "key" "graphWriter" "suffix" "graph-writer") (dict "key" "compliance" "suffix" "compliance") (dict "key" "cloudtrailAnalyzer" "suffix" "cloudtrail-analyzer") (dict "key" "dspmScanner" "suffix" "dspm-scanner") (dict "key" "policyEvaluator" "suffix" "policy-evaluator") (dict "key" "leastPrivilegeSweep" "suffix" "least-privilege-sweep") }}
{{- $serviceAccount := index $.Values.serviceAccounts $item.key }}
{{- if $serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "khalifa.serviceAccountName" (dict "root" $ "key" $item.key "suffix" $item.suffix) }}
  labels:
    {{- include "khalifa.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $item.suffix }}
  {{- with $serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $serviceAccount.automountServiceAccountToken }}
---
{{- end }}
{{- end }}
{{- if and .Values.externalSecrets.enabled .Values.serviceAccounts.externalSecrets.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "khalifa.serviceAccountName" (dict "root" . "key" "externalSecrets" "suffix" "external-secrets") }}
  labels:
    {{- include "khalifa.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.externalSecrets.secretStore.roleArn | quote }}
    {{- with .Values.serviceAccounts.externalSecrets.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccounts.externalSecrets.automountServiceAccountToken }}
{{- end }}

