{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ default (printf "%s-secret-store" (include "khalifa.fullname" .)) .Values.externalSecrets.secretStore.name }}
  labels:
    {{- include "khalifa.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: {{ .Values.externalSecrets.secretStore.service }}
      region: {{ default .Values.config.awsRegion .Values.externalSecrets.secretStore.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "khalifa.serviceAccountName" (dict "root" . "key" "externalSecrets" "suffix" "external-secrets") }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "khalifa.fullname" . }}-external-secrets
  labels:
    {{- include "khalifa.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ default (printf "%s-secret-store" (include "khalifa.fullname" .)) .Values.externalSecrets.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ .Values.externalSecrets.targetName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range .Values.externalSecrets.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteRef.key | quote }}
        {{- with .remoteRef.property }}
        property: {{ . | quote }}
        {{- end }}
        {{- with .remoteRef.version }}
        version: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}

