apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "khalifa.fullname" . }}-graph-writer
  labels:
    {{- include "khalifa.labels" . | nindent 4 }}
    app.kubernetes.io/component: graph-writer
spec:
  replicas: {{ .Values.graphWriter.replicaCount }}
  selector:
    matchLabels:
      {{- include "khalifa.selectorLabels" (dict "root" . "component" "graph-writer") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "khalifa.selectorLabels" (dict "root" . "component" "graph-writer") | nindent 8 }}
        {{- with .Values.graphWriter.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.graphWriter.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "khalifa.serviceAccountName" (dict "root" . "key" "graphWriter" "suffix" "graph-writer") }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.graphWriter.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "khalifa.podSecurityContext" . | nindent 8 }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        {{- include "khalifa.topologySpreadConstraints" (dict "root" . "component" "graph-writer") | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: graph-writer
          image: {{ required "graphWriter.image must be an immutable repository@sha256 digest" .Values.graphWriter.image | quote }}
          imagePullPolicy: IfNotPresent
          args: ["graph-writer"]
          securityContext:
            {{- include "khalifa.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.graphWriter.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "khalifa.fullname" . }}-config
            - secretRef:
                name: {{ include "khalifa.graphWriterTokenSecretName" . }}
            {{- include "khalifa.extraExternalSecretRef" (dict "root" . "component" "graphWriter" "already" (list (include "khalifa.graphWriterTokenSecretName" .))) | nindent 12 }}
          env:
            - name: GRAPH_WRITER_PORT
              value: {{ .Values.graphWriter.port | quote }}
            - name: GRAPH_WRITER_MAX_BODY_BYTES
              value: {{ .Values.graphWriter.maxBodyBytes | quote }}
            - name: GRAPH_WRITER_CONCURRENCY
              value: {{ .Values.graphWriter.concurrency | quote }}
            - name: NEPTUNE_WRITE_CONCURRENCY
              value: {{ .Values.graphWriter.concurrency | quote }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.graphWriter.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "khalifa.fullname" . }}-graph-writer
  labels:
    {{- include "khalifa.labels" . | nindent 4 }}
    app.kubernetes.io/component: graph-writer
  {{- with .Values.graphWriter.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "khalifa.selectorLabels" (dict "root" . "component" "graph-writer") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.graphWriter.service.port }}
      targetPort: http
      protocol: TCP
